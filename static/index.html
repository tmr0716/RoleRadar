<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RoleRadar | Job Application Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>⚡ RoleRadar</h1>
            <p>Track your internship & software engineering application pipeline</p>
        </header>

        <!-- Color Gradient Stats Bar -->
        <section class="stats-grid">
            <div class="stat-card total"><h3 id="stat-total">0</h3><p>Total Applied</p></div>
            <div class="stat-card interview"><h3 id="stat-interview">0</h3><p>Interviewing</p></div>
            <div class="stat-card offer"><h3 id="stat-offer">0</h3><p>Offers</p></div>
            <div class="stat-card rejected"><h3 id="stat-rejected">0</h3><p>Rejected</p></div>
        </section>

        <!-- New Application Form -->
        <section class="form-container">
            <h2>Add New Application</h2>
            <form id="app-form">
                <input type="text" id="company" placeholder="Company Name" required>
                <input type="text" id="role" placeholder="Role Title (e.g. SDE Intern)" required>
                <input type="url" id="url" placeholder="Job Post URL">
                <input type="date" id="date" required>
                <button type="submit">Track Application</button>
            </form>
        </section>

        <!-- Application Board / List -->
        <section class="board-container">
            <h2>Application Pipeline</h2>
            <div id="applications-list" class="applications-grid"></div>
        </section>
    </div>

    <script src="app.js"></script>
</body>
</html>
